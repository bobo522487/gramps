name: Migrate production database

# 生产库迁移曾经靠人工执行，实际从未执行，导致 2026-10-31 线上只跑到 0003：
# 新代码访问旧表，Server Component 抛错，页面只剩 React #441 与 digest。
# 这个 job 就是 ops-target §5.3 说的「独立受保护步骤」，只是改成由 push 触发，
# 不再依赖有人记得去点。
#
# 2026-11-09 补充：G0① 把迁移体系整体重建为「唯一基线 0000_target_schema」。
# 该基线对 auth.* 用 CREATE TABLE IF NOT EXISTS，遇到旧库会整表跳过，
# drizzle-kit 仍报 applied successfully —— 生产 job 就是这么假绿过一次。
# 因此迁移前必须先清空目标库（G1 条件：库内无正式业务数据、明确可删）。
on:
  push:
    branches: [main]
    paths:
      - 'lib/db/migrations/**'
  workflow_dispatch:
    inputs:
      reset:
        description: '重建模式：先清空目标库再执行基线（G0① 需要；日常迁移不要勾）'
        type: boolean
        default: false
      confirm_db:
        description: '仅重建模式必填：逐字输入目标库名（见 POSTGRES_URL_DIRECT 的库名）。不填或填错即拒绝执行'
        type: string
        required: false
        default: ''

# 迁移不能并发，也不能被新提交取消：一个只跑到一半的迁移比没跑更糟。
concurrency:
  group: production-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 把生产 secret 收拢到 environment 作用域：仓库没配保护规则时 GitHub 自动建同名
    # environment，job 照旧可跑（兼容现有用法）；配了 required reviewers / 等待计时器
    # 才会真正拦人。仓库级 secret 仍然可见，所以不需要迁移 secret。
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse to run without the direct database URL
        env:
          POSTGRES_URL_DIRECT: ${{ secrets.POSTGRES_URL_DIRECT }}
        run: |
          if [ -z "$POSTGRES_URL_DIRECT" ]; then
            echo "::error::POSTGRES_URL_DIRECT secret is missing; production migrations cannot run."
            exit 1
          fi

      # 2026-11-09 事故：基线曾写死 `CREATE ROLE genealogy_app … PASSWORD 'app_pw'`。
      # 本地 PG 放行，Neon 控制面拒绝（`insecure password…`，XX000），重建整段失败、
      # 生产库被清空后停在无表状态。角色是部署配置而非 schema，现由脚本接管。
      - name: Refuse to run without the application DB password
        env:
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: |
          if [ -z "$APP_DB_PASSWORD" ]; then
            echo "::error::APP_DB_PASSWORD secret is missing; genealogy_app cannot be provisioned."
            exit 1
          fi

      # 2026-11-09 补：`AUTH_DB_PASSWORD` 与 `APP_DB_PASSWORD` 同一口径。脚本曾经
      # 用 `?? 'auth'` 兜底，缺 secret 时会把 auth_runtime 的口令静默改成 4 字符；
      # 现在脚本不再给默认值，这里也不允许出现「静默跳过改口令」的路径。
      - name: Refuse to run without the auth DB password
        env:
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
        run: |
          if [ -z "$AUTH_DB_PASSWORD" ]; then
            echo "::error::AUTH_DB_PASSWORD secret is missing; auth_runtime cannot be provisioned."
            exit 1
          fi

      # 只由人工触发的重建模式，三道门禁：workflow_dispatch + inputs.reset + 手输库名。
      # 2026-11-09 的 `--confirm="$DB"` 由同一个连接串推导，逐字匹配恒为真——门禁自证，
      # 等于没有。现在 confirm_db 只能由人填，脚本不再有能自动得出正确值的路径。
      # 非重建路径（push 触发的日常迁移）不经过这一步，两者互不影响。
      - name: Reset target database (rebuild mode only)
        if: github.event_name == 'workflow_dispatch' && inputs.reset
        env:
          POSTGRES_URL_DIRECT: ${{ secrets.POSTGRES_URL_DIRECT }}
          # 人填，不与连接串同源。
          CONFIRM_DB: ${{ inputs.confirm_db }}
        run: |
          DB=$(node -e "console.log(decodeURIComponent(new URL(process.env.POSTGRES_URL_DIRECT).pathname.slice(1)))")
          if [ -z "$CONFIRM_DB" ] || [ "$CONFIRM_DB" != "$DB" ]; then
            echo "::error::重建模式需要 confirm_db 与连接串里的库名逐字一致；校验未通过，未执行任何清空。"
            echo "::error::请自行核对 POSTGRES_URL_DIRECT 的库名后重新触发（此处不打印期望值，避免门禁自证）。"
            exit 1
          fi
          echo "重建模式：confirm_db 校验通过，目标库 $DB"
          echo "::warning::重建会清空 $DB 的 public / auth / app / drizzle 四个 schema。"
          pnpm db:reset-target
          pnpm db:reset-target --apply --confirm="$DB"
          echo "== 清空后库状态 =="
          node scripts/diagnose-drizzle-state.mjs

      # 角色先于迁移：基线只建 schema，第一条 GRANT 就要求角色已存在。
      - name: Provision runtime roles (before migrate)
        env:
          POSTGRES_URL_DIRECT: ${{ secrets.POSTGRES_URL_DIRECT }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          AUTH_DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
        run: pnpm db:provision-roles --apply --roles-only

      - name: Apply migrations
        env:
          POSTGRES_URL_DIRECT: ${{ secrets.POSTGRES_URL_DIRECT }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: pnpm db:migrate

      # drizzle-kit 失败时只打进度条、吞掉 SQLSTATE，排查只能靠猜。
      # 失败时逐条试跑基线（事务内回滚、只读）把真实错误打出来。
      - name: Diagnose migration failure
        if: failure()
        env:
          POSTGRES_URL_DIRECT: ${{ secrets.POSTGRES_URL_DIRECT }}
        run: |
          node scripts/diagnose-drizzle-state.mjs
          node scripts/diagnose-migration.mjs

      # 授权必须在迁移之后：`app` schema 与业务表都是基线建的，之前跑会 3F000。
      - name: Provision runtime grants (after migrate)
        env:
          POSTGRES_URL_DIRECT: ${{ secrets.POSTGRES_URL_DIRECT }}
        run: pnpm db:provision-roles --apply --grants-only

      # 迁移完立刻用同一份 journal 校验生产库，失败即红：不留下「迁移跑了一半」的静默状态。
      # 这条不信任 drizzle 的 "applied successfully" —— 2026-11-09 就是那句字面量为真、
      # 库里却什么都没建成。
      - name: Verify production schema
        env:
          POSTGRES_URL_DIRECT: ${{ secrets.POSTGRES_URL_DIRECT }}
          APP_POSTGRES_URL: ${{ secrets.APP_POSTGRES_URL }}
        run: node scripts/verify-deployment.mjs --skip-http --require-runtime-rls
