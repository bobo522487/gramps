name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gramps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gramps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/gramps_test
      # genealogy_app is the LOGIN role created by the single target baseline
      # (A.0). Its sample password comes from the baseline; production injects
      # a real credential per T34 / G1. Never give this role auth.* access.
      APP_POSTGRES_URL: postgres://genealogy_app:app_pw@localhost:5432/gramps_test
      AUTH_POSTGRES_URL: postgres://auth_runtime:auth@localhost:5432/gramps_test
      BETTER_AUTH_SECRET: ci-placeholder-secret-value-long-enough-1234
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm check

      - name: Docs consistency
        run: pnpm run docs:check --strict

      - name: Architecture constraints (F6/F7)
        run: pnpm arch:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      # T42: target-schema verification rebuilds the single baseline in its own
      # throwaway database (gramps_s8_verify), then asserts DDL / SQLSTATE /
      # fail-closed. T40 EXPLAIN numbers need the confirmed target environment,
      # so the script reports an explicit SKIP rather than a fake PASS.
      - name: Verify target schema (T36-T41)
        run: pnpm verify:target-schema

      # T32 revised: the business side uses genealogy_app, which the single
      # target baseline (0000_target_schema.sql A.0) already created during
      # `pnpm db:migrate`. Only the auth side is provisioned out of band:
      # auth_service is a NOLOGIN role and auth_runtime inherits it.
      #
      # The split is deliberate, not transitional: auth.user / auth.session /
      # auth.account / auth.verification have no RLS (verified on PG18), while
      # every public business table does. Giving the business role auth.*
      # access would let it read password hashes and session tokens. The
      # integration-test helper re-applies the auth-side grants after each
      # schema reset.
      - name: Provision auth-side runtime roles
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'auth_service') THEN
              CREATE ROLE auth_service NOLOGIN NOSUPERUSER NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'auth_runtime') THEN
              CREATE ROLE auth_runtime LOGIN PASSWORD 'auth' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END $$;
          GRANT auth_service TO auth_runtime;
          SQL

      - name: Unit + integration tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Check migration drift
        run: |
          set -o pipefail
          pnpm db:generate 2>&1 | tee /tmp/drizzle-generate.log
          # drizzle-kit 遇到列冲突时会打印交互式提示却以 exit 0 静默退出，
          # 且不生成迁移文件；只检查 git status 会假绿（T39）。把输出也纳入断言。
          if grep -q "Interactive prompts" /tmp/drizzle-generate.log; then
            echo "::error::drizzle-kit 需要交互输入，snapshot 与 TS schema 不一致"
            exit 1
          fi
          test -z "$(git status --porcelain lib/db/migrations)"

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E critical path
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Deployment verification
        run: |
          BETTER_AUTH_URL=http://127.0.0.1:3100 \
            pnpm start -p 3100 > /tmp/gramps-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl -sS --retry 30 --retry-connrefused --retry-delay 2 \
            -o /dev/null http://127.0.0.1:3100/api/health
          node scripts/verify-deployment.mjs --base-url http://127.0.0.1:3100
